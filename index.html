<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Mirror & Posture Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe Face Mesh & Pose Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    .glow-good {
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.35);
      border-color: #22c55e !important;
    }
    .glow-warning {
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
      border-color: #eab308 !important;
    }
    .glow-bad {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.45);
      border-color: #ef4444 !important;
    }
    #output_canvas, #webcam {
      transform: scaleX(-1);
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8 font-sans">

  <!-- Header -->
  <header class="text-center max-w-2xl mb-6">
    <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight sm:text-4xl">Focus Mirror & Posture AI</h1>
    <p class="text-slate-400 text-sm mt-2">Enhanced 3D torso geometry tracking & side-turn suppression.</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-4xl flex flex-col items-center gap-6">

    <!-- Status Bar Badges -->
    <div class="w-full flex flex-wrap justify-center items-center gap-4">
      
      <!-- Focus Indicator Badge -->
      <div id="focus-badge" class="flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 transition-all duration-300">
        <span id="focus-icon" class="text-2xl">👁️</span>
        <div class="flex flex-col">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Screen Focus</span>
          <span id="focus-text" class="text-base font-bold text-slate-200">Initializing...</span>
        </div>
      </div>

      <!-- Posture Indicator Badge -->
      <div id="posture-badge" class="flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 transition-all duration-300">
        <span id="posture-icon" class="text-2xl">🧘</span>
        <div class="flex flex-col">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Body Posture</span>
          <span id="posture-text" class="text-base font-bold text-slate-200">Initializing...</span>
        </div>
      </div>

    </div>

    <!-- Video Feed Frame -->
    <div id="mirror-card" class="relative w-full max-w-2xl aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-500">
      <video id="webcam" class="hidden" playsinline></video>
      <canvas id="output_canvas" class="w-full h-full object-cover"></canvas>

      <!-- Overlay Spinner when Loading -->
      <div id="loading-overlay" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center gap-3 z-10">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm font-medium text-slate-300">Starting Camera & AI Models...</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap justify-center items-center gap-4">
      <button id="recalibrate-btn" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-semibold text-sm transition-all shadow-md">
        🎯 Recalibrate Neutral Posture
      </button>

      <button id="enable-notifications-btn" class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 font-semibold text-sm transition-all shadow-md flex items-center gap-2">
        <span>🔔</span> Enable Background Pop-ups & Audio
      </button>
    </div>

  </main>

  <!-- Application Logic -->
  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const mirrorCard = document.getElementById('mirror-card');

    const focusBadge = document.getElementById('focus-badge');
    const focusIcon = document.getElementById('focus-icon');
    const focusText = document.getElementById('focus-text');

    const postureBadge = document.getElementById('posture-badge');
    const postureIcon = document.getElementById('posture-icon');
    const postureText = document.getElementById('posture-text');
    const loadingOverlay = document.getElementById('loading-overlay');
    const recalibrateBtn = document.getElementById('recalibrate-btn');
    const enableNotificationsBtn = document.getElementById('enable-notifications-btn');

    // State Variables
    let rawFocusState = "OUT";
    let smoothedFocusState = "OUT";

    let rawPostureState = "GOOD";
    let smoothedPostureState = "GOOD";
    let postureReason = "";

    // Delay Buffers
    let postureBadStartTime = null;
    let postureGoodStartTime = null;
    const POSTURE_DELAY_MS = 1800; // 1.8s buffer to prevent false triggers during movement

    let focusOutStartTime = null;
    let focusInStartTime = null;
    const FOCUS_DELAY_MS = 800;

    // Calibration Baselines
    let baselineHeadToShoulderDist = null;
    let baselineShoulderWidth = null;
    let isCalibrated = false;

    // Notification Control
    let notificationsAllowed = false;
    let lastAlertTime = 0;
    const ALERT_COOLDOWN_MS = 10000;

    // Request Notifications
    enableNotificationsBtn.addEventListener('click', async () => {
      if ('Notification' in window) {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          notificationsAllowed = true;
          enableNotificationsBtn.textContent = "🔔 Background Alerts Enabled";
          enableNotificationsBtn.className = "px-5 py-2.5 rounded-lg bg-slate-700 text-slate-300 font-semibold text-sm cursor-default";
          playAlertSound();
          new Notification("Focus & Posture Tracker", {
            body: "Background notifications active! You will be alerted when posture or focus drops.",
            icon: "https://cdn-icons-png.flaticon.com/512/1828/1828843.png"
          });
        }
      }
    });

    // Web Audio Synthesizer
    function playAlertSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(293.66, audioCtx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    // Trigger System Notification
    function triggerSystemAlert(title, message) {
      const now = Date.now();
      if (notificationsAllowed && (now - lastAlertTime > ALERT_COOLDOWN_MS)) {
        lastAlertTime = now;
        playAlertSound();
        new Notification(title, { body: message, tag: "focus-posture-alert", renotify: true });
      }
    }

    // MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Process Face Mesh
    faceMesh.onResults((results) => {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        rawFocusState = "OUT";
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      const noseTip = landmarks[1];
      const leftCheek = landmarks[234];
      const rightCheek = landmarks[454];
      const forehead = landmarks[10];
      const chin = landmarks[152];

      const leftDist = Math.abs(noseTip.x - leftCheek.x);
      const rightDist = Math.abs(noseTip.x - rightCheek.x);
      const yawRatio = leftDist / (rightDist + 0.0001);

      const upperDist = Math.abs(noseTip.y - forehead.y);
      const lowerDist = Math.abs(noseTip.y - chin.y);
      const pitchRatio = upperDist / (lowerDist + 0.0001);

      const isTurnedHorizontally = yawRatio < 0.35 || yawRatio > 2.85;
      const isTiltedVertically = pitchRatio < 0.35 || pitchRatio > 2.5;

      if (isTurnedHorizontally || isTiltedVertically) {
        rawFocusState = "TURNING";
      } else {
        rawFocusState = "IN";
      }
    });

    // Process Pose with 3D Geometry
    pose.onResults((results) => {
      if (canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;
        const nose = landmarks[0];
        const leftEar = landmarks[7];
        const rightEar = landmarks[8];
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];

        if (leftShoulder && rightShoulder && nose && leftShoulder.visibility > 0.5 && rightShoulder.visibility > 0.5) {
          
          // 1. Calculate Shoulder Midpoint & Distance Metrics
          const shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
          const shoulderMidY = (leftShoulder.y + rightShoulder.y) / 2;

          // Euclidean distance between shoulders (Width)
          const currShoulderWidth = Math.hypot(leftShoulder.x - rightShoulder.x, leftShoulder.y - rightShoulder.y);

          // Head-to-Shoulder Vertical Distance (Normalized by shoulder width to make scale-invariant)
          const earMidY = (leftEar && rightEar) ? (leftEar.y + rightEar.y) / 2 : nose.y;
          const rawHeadToShoulderDist = Math.abs(earMidY - shoulderMidY);
          const normalizedHeadToShoulder = rawHeadToShoulderDist / (currShoulderWidth + 0.0001);

          // 2. Torso Yaw / Sideways Turn Detection
          // If shoulders or head are rotated significantly sideways, suppress standard horizontal tilt false positives
          const shoulderDx = Math.abs(leftShoulder.x - rightShoulder.x);
          const isBodyTurnedSideways = (shoulderDx / (currShoulderWidth + 0.0001)) < 0.7;

          // 3. Auto-Calibration Baseline
          if (!isCalibrated) {
            baselineHeadToShoulderDist = normalizedHeadToShoulder;
            baselineShoulderWidth = currShoulderWidth;
            isCalibrated = true;
          }

          // 4. Posture Checks
          // A. Forward Slouch / Bending Shoulders & Waist (Head drops toward shoulders)
          const isBendingForward = normalizedHeadToShoulder < (baselineHeadToShoulderDist * 0.75);

          // B. Leaning Back / Far Depth Shift (Shoulder width shrinks significantly relative to baseline without side rotation)
          const isLeaningBack = !isBodyTurnedSideways && (currShoulderWidth < baselineShoulderWidth * 0.75);

          // C. Leaning Too Far Forward (Shoulder width expands beyond baseline limit)
          const isLeaningForward = !isBodyTurnedSideways && (currShoulderWidth > baselineShoulderWidth * 1.35);

          // D. Asymmetric Lateral Leaning / Slouching (Only evaluated when NOT turned sideways)
          const shoulderTilt = Math.abs(leftShoulder.y - rightShoulder.y);
          const isLateralLeaning = !isBodyTurnedSideways && (shoulderTilt > 0.09);

          // Evaluate bad posture & assign descriptive reason
          if (isBendingForward) {
            rawPostureState = "BAD";
            postureReason = "Bending Shoulders / Waist";
          } else if (isLeaningBack) {
            rawPostureState = "BAD";
            postureReason = "Leaning Back";
          } else if (isLeaningForward) {
            rawPostureState = "BAD";
            postureReason = "Leaning Too Close";
          } else if (isLateralLeaning) {
            rawPostureState = "BAD";
            postureReason = "Leaning Sideways";
          } else {
            rawPostureState = "GOOD";
            postureReason = "Good Posture";
          }
        }
      }

      canvasCtx.restore();

      applyDebouncedStates();
      updateUI();

      loadingOverlay.classList.add('hidden');
    });

    // Debounce States
    function applyDebouncedStates() {
      const now = Date.now();

      // Debounce Posture
      if (rawPostureState === "BAD") {
        postureGoodStartTime = null;
        if (!postureBadStartTime) postureBadStartTime = now;
        if (now - postureBadStartTime >= POSTURE_DELAY_MS) {
          if (smoothedPostureState !== "BAD") {
            smoothedPostureState = "BAD";
            triggerSystemAlert("⚠️ Posture Alert!", `${postureReason}. Adjust your seating position.`);
          }
        }
      } else {
        postureBadStartTime = null;
        if (!postureGoodStartTime) postureGoodStartTime = now;
        if (now - postureGoodStartTime >= POSTURE_DELAY_MS) {
          smoothedPostureState = "GOOD";
        }
      }

      // Debounce Focus
      if (rawFocusState !== "IN") {
        focusInStartTime = null;
        if (!focusOutStartTime) focusOutStartTime = now;
        if (now - focusOutStartTime >= FOCUS_DELAY_MS) {
          if (smoothedFocusState !== rawFocusState) {
            smoothedFocusState = rawFocusState;
            if (smoothedFocusState === "TURNING") {
              triggerSystemAlert("⚠️ Focus Alert!", "Head turned away from screen.");
            } else if (smoothedFocusState === "OUT") {
              triggerSystemAlert("❌ Absence Alert!", "No face detected at the screen.");
            }
          }
        }
      } else {
        focusOutStartTime = null;
        if (!focusInStartTime) focusInStartTime = now;
        if (now - focusInStartTime >= FOCUS_DELAY_MS) {
          smoothedFocusState = "IN";
        }
      }
    }

    // Update Badges & Glows
    function updateUI() {
      // Focus UI
      if (smoothedFocusState === "IN") {
        focusIcon.textContent = "👁️";
        focusText.textContent = "In Focus";
        focusText.className = "text-base font-bold text-green-400";
        focusBadge.className = "flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-green-500/40";
      } else if (smoothedFocusState === "TURNING") {
        focusIcon.textContent = "⚠️";
        focusText.textContent = "Turned Away";
        focusText.className = "text-base font-bold text-amber-400";
        focusBadge.className = "flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-amber-500/40";
      } else {
        focusIcon.textContent = "❌";
        focusText.textContent = "Away from Screen";
        focusText.className = "text-base font-bold text-red-400";
        focusBadge.className = "flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-red-500/40";
      }

      // Posture UI
      if (smoothedPostureState === "GOOD") {
        postureIcon.textContent = "🧘";
        postureText.textContent = "Good Posture";
        postureText.className = "text-base font-bold text-green-400";
        postureBadge.className = "flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-green-500/40";
      } else {
        postureIcon.textContent = "⚠️";
        postureText.textContent = postureReason || "Poor Posture";
        postureText.className = "text-base font-bold text-red-400";
        postureBadge.className = "flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-red-500/40";
      }

      // Card Ambient Glow
      mirrorCard.classList.remove("glow-good", "glow-warning", "glow-bad");
      if (smoothedFocusState === "IN" && smoothedPostureState === "GOOD") {
        mirrorCard.classList.add("glow-good");
      } else if (smoothedFocusState === "TURNING" || (smoothedFocusState === "IN" && smoothedPostureState === "BAD")) {
        mirrorCard.classList.add("glow-warning");
      } else {
        mirrorCard.classList.add("glow-bad");
      }
    }

    // Recalibrate Button Listener
    recalibrateBtn.addEventListener('click', () => {
      isCalibrated = false;
      postureText.textContent = "Recalibrating...";
      postureText.className = "text-base font-bold text-indigo-400";
    });

    // Camera Start
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
