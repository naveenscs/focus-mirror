<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Mirror & Ergonomic Posture AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    .glow-good { box-shadow: 0 0 25px rgba(34, 197, 94, 0.35); border-color: #22c55e !important; }
    .glow-warning { box-shadow: 0 0 25px rgba(234, 179, 8, 0.4); border-color: #eab308 !important; }
    .glow-bad { box-shadow: 0 0 25px rgba(239, 68, 68, 0.45); border-color: #ef4444 !important; }
    #output_canvas, #webcam { transform: scaleX(-1); }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8 font-sans">

  <header class="text-center max-w-2xl mb-6">
    <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight sm:text-4xl">Focus Mirror & Ergonomic AI</h1>
    <p class="text-slate-400 text-sm mt-2">OSHA / ISO 9241-5 Angle Tracking & Floating Background Overlay</p>
  </header>

  <main class="w-full max-w-4xl flex flex-col items-center gap-6">

    <!-- Status Bar Badges -->
    <div class="w-full flex flex-wrap justify-center items-center gap-4">
      <div id="focus-badge" class="flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 transition-all duration-300">
        <span id="focus-icon" class="text-2xl">👁️</span>
        <div class="flex flex-col">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Screen Focus</span>
          <span id="focus-text" class="text-base font-bold text-slate-200">Initializing...</span>
        </div>
      </div>

      <div id="posture-badge" class="flex items-center gap-3 px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 transition-all duration-300">
        <span id="posture-icon" class="text-2xl">🧘</span>
        <div class="flex flex-col">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Ergonomic Posture</span>
          <span id="posture-text" class="text-base font-bold text-slate-200">Initializing...</span>
        </div>
      </div>
    </div>

    <!-- Video Feed Frame -->
    <div id="mirror-card" class="relative w-full max-w-2xl aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-500">
      <video id="webcam" class="hidden" playsinline></video>
      <canvas id="output_canvas" class="w-full h-full object-cover"></canvas>
      <video id="pip-video" autoplay muted class="hidden"></video>

      <div id="loading-overlay" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center gap-3 z-10">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm font-medium text-slate-300">Starting Camera & Ergonomic Models...</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap justify-center items-center gap-4">
      <button id="pip-btn" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition-all shadow-md flex items-center gap-2">
        <span>📌</span> Pop-out Floating Overlay (Prevents Tab Throttle)
      </button>

      <button id="enable-notifications-btn" class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm transition-all shadow-md flex items-center gap-2">
        <span>🔔</span> System Alerts
      </button>
    </div>

    <!-- Live Ergonomic Angle Metrics Dashboard -->
    <div class="w-full max-w-2xl bg-slate-800/80 border border-slate-700 rounded-2xl p-5 text-sm grid grid-cols-3 gap-4 text-center">
      <div>
        <div class="text-xs text-slate-400 uppercase font-semibold">Neck Flexion</div>
        <div id="metric-neck" class="text-xl font-bold text-indigo-400">0°</div>
        <div class="text-[10px] text-slate-500">Limit: &le; 15°</div>
      </div>
      <div>
        <div class="text-xs text-slate-400 uppercase font-semibold">CVA Angle</div>
        <div id="metric-cva" class="text-xl font-bold text-indigo-400">0°</div>
        <div class="text-[10px] text-slate-500">Limit: &ge; 50°</div>
      </div>
      <div>
        <div class="text-xs text-slate-400 uppercase font-semibold">Shoulder Tilt</div>
        <div id="metric-tilt" class="text-xl font-bold text-indigo-400">0°</div>
        <div class="text-[10px] text-slate-500">Limit: &le; 5°</div>
      </div>
    </div>

  </main>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const pipVideo = document.getElementById('pip-video');
    const pipBtn = document.getElementById('pip-btn');
    const mirrorCard = document.getElementById('mirror-card');

    const focusIcon = document.getElementById('focus-icon');
    const focusText = document.getElementById('focus-text');
    const postureIcon = document.getElementById('posture-icon');
    const postureText = document.getElementById('posture-text');
    const loadingOverlay = document.getElementById('loading-overlay');
    const enableNotificationsBtn = document.getElementById('enable-notifications-btn');

    const metricNeck = document.getElementById('metric-neck');
    const metricCva = document.getElementById('metric-cva');
    const metricTilt = document.getElementById('metric-tilt');

    let rawPostureState = "GOOD";
    let smoothedPostureState = "GOOD";
    let postureReason = "";

    let rawFocusState = "OUT";
    let smoothedFocusState = "OUT";

    let notificationsAllowed = false;
    let lastAlertTime = 0;

    // PiP Stream setup to bypass tab throttling
    const stream = canvasElement.captureStream(30);
    pipVideo.srcObject = stream;

    pipBtn.addEventListener('click', async () => {
      try {
        await pipVideo.play();
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await pipVideo.requestPictureInPicture();
        }
      } catch (err) {
        alert("Picture-in-Picture error: " + err.message);
      }
    });

    enableNotificationsBtn.addEventListener('click', async () => {
      if ('Notification' in window) {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          notificationsAllowed = true;
          enableNotificationsBtn.textContent = "🔔 System Alerts Active";
        }
      }
    });

    function triggerSystemAlert(title, message) {
      if (notificationsAllowed && (Date.now() - lastAlertTime > 8000)) {
        lastAlertTime = Date.now();
        new Notification(title, { body: message, tag: "posture-alert", renotify: true });
      }
    }

    const faceMesh = new FaceMesh({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

    const pose = new Pose({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });

    faceMesh.onResults(results => {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        rawFocusState = "OUT";
        return;
      }
      const nose = results.multiFaceLandmarks[0][1];
      const lCheek = results.multiFaceLandmarks[0][234];
      const rCheek = results.multiFaceLandmarks[0][454];
      const yaw = Math.abs(nose.x - lCheek.x) / (Math.abs(nose.x - rCheek.x) + 0.0001);
      
      rawFocusState = (yaw < 0.35 || yaw > 2.85) ? "TURNING" : "IN";
    });

    pose.onResults(results => {
      if (canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const leftEar = lm[7], rightEar = lm[8];
        const leftShoulder = lm[11], rightShoulder = lm[12];

        if (leftShoulder && rightShoulder && leftShoulder.visibility > 0.5) {
          const earMidX = (leftEar.x + rightEar.x) / 2;
          const earMidY = (leftEar.y + rightEar.y) / 2;
          const shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
          const shoulderMidY = (leftShoulder.y + rightShoulder.y) / 2;

          // 1. Neck Flexion Angle (Forward Head Protrusion)
          const dxNeck = (earMidX - shoulderMidX) * canvasElement.width;
          const dyNeck = (shoulderMidY - earMidY) * canvasElement.height;
          const neckFlexionDeg = Math.abs(Math.atan2(dxNeck, dyNeck) * (180 / Math.PI));

          // 2. Craniovertebral Angle (CVA)
          const cvaDeg = Math.abs(Math.atan2(dyNeck, Math.abs(dxNeck)) * (180 / Math.PI));

          // 3. Shoulder Lateral Tilt (Normalized to account for clothing & perspective)
          const rawShoulderTilt = Math.abs((rightShoulder.y - leftShoulder.y) * canvasElement.height);
          const shoulderWidth = Math.hypot(leftShoulder.x - rightShoulder.x, leftShoulder.y - rightShoulder.y) * canvasElement.width;
          const normalizedTilt = rawShoulderTilt / (shoulderWidth + 0.0001);
          const shoulderTiltDeg = Math.abs(Math.atan2(rawShoulderTilt, shoulderWidth) * (180 / Math.PI));

          // Dashboard Updates
          metricNeck.textContent = `${Math.round(neckFlexionDeg)}°`;
          metricCva.textContent = `${Math.round(cvaDeg)}°`;
          metricTilt.textContent = `${Math.round(shoulderTiltDeg)}°`;

          // Ergonomic Rules Check
          if (neckFlexionDeg > 18 || cvaDeg < 48) {
            rawPostureState = "BAD";
            postureReason = "Forward Head / Slouching";
          } else if (normalizedTilt > 0.12) {
            rawPostureState = "BAD";
            postureReason = "Asymmetric Shoulder Tilt";
          } else {
            rawPostureState = "GOOD";
            postureReason = "Good Ergonomics";
          }
        }
      }

      canvasCtx.restore();
      updateUI();
      loadingOverlay.classList.add('hidden');
    });

    function updateUI() {
      if (rawPostureState === "BAD") {
        postureText.textContent = postureReason;
        postureText.className = "text-base font-bold text-red-400";
        triggerSystemAlert("⚠️ Ergonomic Alert", postureReason);
      } else {
        postureText.textContent = "Good Ergonomics";
        postureText.className = "text-base font-bold text-green-400";
      }

      if (rawFocusState === "IN") {
        focusText.textContent = "In Focus";
        focusText.className = "text-base font-bold text-green-400";
      } else {
        focusText.textContent = "Focus Lost";
        focusText.className = "text-base font-bold text-amber-400";
      }
    }

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
