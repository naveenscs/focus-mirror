<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart AI Ergonomic Guard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    .glow-good { box-shadow: 0 0 20px rgba(34, 197, 94, 0.25); }
    .glow-warning { box-shadow: 0 0 20px rgba(234, 179, 8, 0.25); }
    .glow-bad { box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
    
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }
      50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    }
    .popup-alert { animation: pulse-border 1.5s infinite ease-in-out; }

    @keyframes spine-correct {
      0% { d: path("M25 18 Q 35 34 25 50"); }
      50% { d: path("M25 18 Q 15 34 25 50"); }
      100% { d: path("M25 18 L25 50"); }
    }
    .animate-spine-guide { animation: spine-correct 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Floating Mirror & Correction Pop-up Modal -->
  <div id="correctionPopup" class="hidden fixed bottom-6 right-6 z-50 w-80 bg-slate-800/95 border-2 border-red-500 rounded-2xl shadow-2xl backdrop-blur-md overflow-hidden popup-alert transition-all duration-300">
    <div class="bg-slate-900/90 px-4 py-2 border-b border-slate-700 flex items-center justify-between cursor-move" id="popupHeader">
      <div class="flex items-center gap-2">
        <span class="text-sm">🚨</span>
        <span id="popupTitle" class="text-xs font-bold text-red-400 tracking-wide uppercase">Ergonomic Alert</span>
      </div>
      <button id="closePopupBtn" class="text-slate-400 hover:text-slate-200 text-sm font-bold px-1">✕</button>
    </div>
    
    <div class="p-3 flex flex-col gap-3">
      <!-- Live Video Mirror Canvas in Pop-up -->
      <div class="relative aspect-video rounded-lg bg-black overflow-hidden border border-slate-700">
        <canvas id="popupCanvas" class="w-full h-full object-cover transform -scale-x-100"></canvas>
        <div class="absolute bottom-1.5 left-2 bg-slate-900/80 px-2 py-0.5 rounded text-[10px] text-slate-300 font-semibold">
          Live Mirror
        </div>
      </div>

      <!-- Animated Posture Correction & Instructions -->
      <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700 flex items-center gap-3">
        <div class="w-12 h-12 flex-shrink-0 flex items-center justify-center bg-slate-800 rounded-lg">
          <svg class="w-8 h-8 stroke-green-400" viewBox="0 0 50 60" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="25" cy="12" r="6" />
            <path d="M12 28 L38 28" />
            <path class="animate-spine-guide" d="M25 18 L25 50" />
          </svg>
        </div>
        <div>
          <div id="popupReason" class="text-xs font-bold text-red-400">Slouch Detected!</div>
          <div id="popupGuide" class="text-[11px] text-slate-300 mt-0.5">Sit straight, pull shoulders back, and align head with spine.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🛡️</span>
        <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
          ErgoGuard AI
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="notifyPermissionBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-semibold transition flex items-center gap-2">
          <span id="notifyIcon">🔔</span>
          <span id="notifyText">Enable OS Notifications</span>
        </button>
        <button id="soundToggleBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-semibold transition flex items-center gap-2">
          <span id="soundIcon">🔊</span>
          <span id="soundText">Sound On</span>
        </button>
        <button id="recalibrateBtn" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow-sm">
          Recalibrate Posture
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 w-full">

    <!-- Video & Camera Overlay Card -->
    <div id="mirrorCard" class="lg:col-span-2 relative aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-300">
      <video id="videoElement" class="hidden" playsinline></video>
      <canvas id="canvasElement" class="w-full h-full object-cover transform -scale-x-100"></canvas>
      
      <!-- Overlay Canvas Labels -->
      <div class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Live Analysis</span>
      </div>
    </div>

    <!-- Right Control Panel & Metrics -->
    <div class="flex flex-col gap-4">

      <!-- Focus State Card -->
      <div class="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/60 backdrop-blur">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Attention State</h2>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span id="focusIcon" class="text-2xl">👤</span>
            <div>
              <div id="focusText" class="text-base font-bold text-slate-400">Away</div>
              <div id="focusSubtext" class="text-xs text-slate-400">Facing monitor center</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Posture Status Card -->
      <div class="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/60 backdrop-blur">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Ergonomic Posture</h2>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span id="postureIcon" class="text-2xl">👤</span>
            <div>
              <div id="postureText" class="text-base font-bold text-slate-400">No Person Detected</div>
              <div id="postureSubtext" class="text-xs text-slate-400">Spine and neck alignment</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Alignment Diagram -->
      <div class="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/60 backdrop-blur flex-1 flex flex-col justify-between">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Spine Alignment Preview</h2>
        
        <div class="flex items-center justify-center my-4">
          <svg id="liveSvg" class="w-24 h-24 stroke-slate-500 transition-all duration-300" viewBox="0 0 50 60" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <!-- Spine Vector Representation -->
            <circle id="svgHead" cx="25" cy="12" r="6" />
            <path id="svgShoulders" d="M12 28 L38 28" />
            <path id="svgSpine" d="M25 18 L25 50" />
          </svg>
        </div>

        <div class="text-center">
          <div id="vizStatusText" class="text-[10px] text-slate-400 font-semibold">Waiting for user...</div>
        </div>
      </div>

    </div>
  </main>

  <!-- Application Logic -->
  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');

    // Pop-up Canvas Elements
    const correctionPopup = document.getElementById('correctionPopup');
    const popupCanvas = document.getElementById('popupCanvas');
    const popupCtx = popupCanvas.getContext('2d');
    const popupReason = document.getElementById('popupReason');
    const popupGuide = document.getElementById('popupGuide');
    const closePopupBtn = document.getElementById('closePopupBtn');
    let popupManuallyClosed = false;

    // UI Elements
    const focusIcon = document.getElementById('focusIcon');
    const focusText = document.getElementById('focusText');
    const postureIcon = document.getElementById('postureIcon');
    const postureText = document.getElementById('postureText');
    const mirrorCard = document.getElementById('mirrorCard');
    const recalibrateBtn = document.getElementById('recalibrateBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const notifyPermissionBtn = document.getElementById('notifyPermissionBtn');
    const notifyIcon = document.getElementById('notifyIcon');
    const notifyText = document.getElementById('notifyText');

    const liveSvg = document.getElementById('liveSvg');
    const svgHead = document.getElementById('svgHead');
    const svgShoulders = document.getElementById('svgShoulders');
    const svgSpine = document.getElementById('svgSpine');
    const vizStatusText = document.getElementById('vizStatusText');

    // State Variables
    let isHumanPresent = false;
    let soundEnabled = true;
    let isCalibrated = false;
    let baselineHeadDist = 0;
    let baselineShoulderWidth = 0;

    let rawFocusState = "NO_HUMAN";
    let rawPostureState = "NO_HUMAN";
    let smoothedPostureState = "GOOD";
    let postureReason = "Good Posture";

    let currentNeckAngle = 0;
    let currentTiltAngle = 0;

    // System Notification State
    let lastNotificationTime = 0;
    const NOTIFICATION_COOLDOWN_MS = 10000; // Throttle desktop notifications to every 10s
    let originalTitle = document.title;
    let titleInterval = null;

    // Debounce & Audio Logic States
    let postureBadStartTime = null;
    let postureGoodStartTime = null;
    let hasPlayedSoundForCurrentBadState = false;
    const DEBOUNCE_DELAY_MS = 2000;

    // Global Audio Context initialized on user gesture
    let audioCtx = null;
    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    window.addEventListener('click', initAudioContext, { once: true });
    window.addEventListener('keydown', initAudioContext, { once: true });

    // Request OS Notification Permission
    async function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("This browser does not support desktop notifications.");
        return;
      }
      const permission = await Notification.requestPermission();
      updateNotificationBtnUI(permission);
    }

    function updateNotificationBtnUI(permission) {
      if (permission === "granted") {
        notifyIcon.textContent = "🔕";
        notifyText.textContent = "OS Alerts Active";
        notifyPermissionBtn.classList.replace("bg-slate-800", "bg-emerald-900/40");
        notifyPermissionBtn.classList.replace("border-slate-700", "border-emerald-600");
      } else if (permission === "denied") {
        notifyIcon.textContent = "🚫";
        notifyText.textContent = "OS Alerts Blocked";
      }
    }

    notifyPermissionBtn.addEventListener('click', () => {
      requestNotificationPermission();
    });

    // Check initial notification status on startup
    if ("Notification" in window) {
      updateNotificationBtnUI(Notification.permission);
    }

    // Trigger System Level OS Pop-up Notification
    function triggerSystemNotification(title, message) {
      // Send OS Notification if tab is hidden/out of focus
      if ("Notification" in window && Notification.permission === "granted") {
        const now = Date.now();
        if (now - lastNotificationTime > NOTIFICATION_COOLDOWN_MS) {
          const notification = new Notification(`🚨 ${title}`, {
            body: message,
            requireInteraction: false
          });
          notification.onclick = () => {
            window.focus();
            notification.close();
          };
          lastNotificationTime = now;
        }
      }

      // Flash Page Tab Title
      if (!titleInterval) {
        titleInterval = setInterval(() => {
          document.title = document.title === originalTitle ? "🚨 BAD POSTURE DETECTED!" : originalTitle;
        }, 1000);
      }
    }

    function resetTitleAlert() {
      if (titleInterval) {
        clearInterval(titleInterval);
        titleInterval = null;
        document.title = originalTitle;
      }
    }

    // Close Popup Listener
    closePopupBtn.addEventListener('click', () => {
      correctionPopup.classList.add('hidden');
      popupManuallyClosed = true;
    });

    // Audio Alert Chime Synthesis
    function playAlertChime() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) initAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {
        console.error("Audio playback error:", e);
      }
    }

    // Toggle Audio
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? "🔊" : "🔇";
      soundText.textContent = soundEnabled ? "Sound On" : "Sound Off";
      initAudioContext();
    });

    // Recalibrate Baseline
    recalibrateBtn.addEventListener('click', () => {
      isCalibrated = false;
    });

    // MediaPipe Models Initialization
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 4, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    // Helper: Find Primary Person (Largest face closest to camera)
    function getPrimaryFaceLandmarks(multiFaceLandmarks) {
      if (!multiFaceLandmarks || multiFaceLandmarks.length === 0) return null;
      let primaryFace = null;
      let maxArea = -1;

      multiFaceLandmarks.forEach(landmarks => {
        const lCheek = landmarks[234];
        const rCheek = landmarks[454];
        const dist = Math.hypot(lCheek.x - rCheek.x, lCheek.y - rCheek.y);
        if (dist > maxArea) {
          maxArea = dist;
          primaryFace = landmarks;
        }
      });
      return primaryFace;
    }

    // Face Mesh Callback (Locks onto primary person in foreground)
    faceMesh.onResults(results => {
      const primaryLandmarks = getPrimaryFaceLandmarks(results.multiFaceLandmarks);
      if (!primaryLandmarks) {
        rawFocusState = "NO_HUMAN";
        isHumanPresent = false;
        return;
      }
      isHumanPresent = true;
      const nose = primaryLandmarks[1];
      const lCheek = primaryLandmarks[234];
      const rCheek = primaryLandmarks[454];
      const yaw = Math.abs(nose.x - lCheek.x) / (Math.abs(nose.x - rCheek.x) + 0.0001);
      
      rawFocusState = (yaw < 0.35 || yaw > 2.85) ? "TURNING" : "IN";
    });

    // Pose Callback (Guarded Behind Presence Check)
    pose.onResults(results => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks && isHumanPresent) {
        const lm = results.poseLandmarks;
        const leftEar = lm[7], rightEar = lm[8];
        const leftShoulder = lm[11], rightShoulder = lm[12];
        const nose = lm[0];

        if (leftShoulder && rightShoulder && nose && leftShoulder.visibility > 0.5) {
          const shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
          const shoulderMidY = (leftShoulder.y + rightShoulder.y) / 2;
          const shoulderWidth = Math.hypot(leftShoulder.x - rightShoulder.x, leftShoulder.y - rightShoulder.y);
          
          const earMidY = (leftEar && rightEar) ? (leftEar.y + rightEar.y) / 2 : nose.y;
          const earMidX = (leftEar && rightEar) ? (leftEar.x + rightEar.x) / 2 : nose.x;

          const headToShoulderDist = Math.abs(earMidY - shoulderMidY) / (shoulderWidth + 0.0001);

          // Calculate Angles for Overlay
          const dxNeck = (earMidX - shoulderMidX) * canvasElement.width;
          const dyNeck = (shoulderMidY - earMidY) * canvasElement.height;
          currentNeckAngle = Math.round(Math.abs(Math.atan2(dxNeck, dyNeck) * (180 / Math.PI)));

          const dyShoulder = Math.abs(rightShoulder.y - leftShoulder.y) * canvasElement.height;
          const dxShoulder = Math.abs(rightShoulder.x - leftShoulder.x) * canvasElement.width;
          currentTiltAngle = Math.round(Math.abs(Math.atan2(dyShoulder, dxShoulder) * (180 / Math.PI)));

          // Auto-Calibration
          if (!isCalibrated) {
            baselineHeadDist = headToShoulderDist;
            baselineShoulderWidth = shoulderWidth;
            isCalibrated = true;
          }

          // Tiered Deviation Evaluation
          const headDropRatio = headToShoulderDist / baselineHeadDist;
          const forwardLeanRatio = shoulderWidth / baselineShoulderWidth;

          if (headDropRatio < 0.70 || forwardLeanRatio > 1.30) {
            rawPostureState = "BAD";
            postureReason = "Severe Slouch / Forward Bend";
          } else if (headDropRatio < 0.85 || forwardLeanRatio > 1.15 || currentTiltAngle > 8) {
            rawPostureState = "SLIGHT";
            postureReason = "Slight Posture Shift";
          } else {
            rawPostureState = "GOOD";
            postureReason = "Good Posture";
          }

          drawOnCameraSkeleton(canvasCtx, { earMidX, earMidY, shoulderMidX, shoulderMidY, leftShoulder, rightShoulder }, rawPostureState);
        }
      } else {
        // Reset state when no human is detected
        rawPostureState = "NO_HUMAN";
        postureBadStartTime = null;
        postureGoodStartTime = null;
        hasPlayedSoundForCurrentBadState = false;
      }

      canvasCtx.restore();

      // Mirror canvas content onto pop-up canvas
      popupCanvas.width = canvasElement.width;
      popupCanvas.height = canvasElement.height;
      popupCtx.clearRect(0, 0, popupCanvas.width, popupCanvas.height);
      popupCtx.drawImage(canvasElement, 0, 0);

      processPostureDebounce();
      updateUI();
    });

    // Draw Skeleton & Metric Overlay on Canvas
    function drawOnCameraSkeleton(ctx, pts, state) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      const color = state === "GOOD" ? "#22c55e" : (state === "SLIGHT" ? "#eab308" : "#ef4444");

      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(pts.earMidX * w, pts.earMidY * h);
      ctx.lineTo(pts.shoulderMidX * w, pts.shoulderMidY * h);
      ctx.moveTo(pts.leftShoulder.x * w, pts.leftShoulder.y * h);
      ctx.lineTo(pts.rightShoulder.x * w, pts.rightShoulder.y * h);
      ctx.stroke();

      // Mirror canvas context back to align text correctly
      ctx.save();
      ctx.scale(-1, 1);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText(`Neck Tilt: ${currentNeckAngle}°`, - (pts.shoulderMidX * w) + 15, (pts.shoulderMidY * h) - 10);
      ctx.fillText(`Shoulder Tilt: ${currentTiltAngle}°`, - (pts.shoulderMidX * w) + 15, (pts.shoulderMidY * h) + 15);
      ctx.restore();
    }

    // Debounce Logic & Chime Triggering
    function processPostureDebounce() {
      const now = Date.now();

      if (rawPostureState === "BAD") {
        postureGoodStartTime = null;
        if (!postureBadStartTime) {
          postureBadStartTime = now;
        } else if (now - postureBadStartTime >= DEBOUNCE_DELAY_MS) {
          if (smoothedPostureState !== "BAD") {
            smoothedPostureState = "BAD";
          }
          if (!hasPlayedSoundForCurrentBadState) {
            playAlertChime();
            triggerSystemNotification("Ergonomic Warning", postureReason + " - Please sit straight!");
            hasPlayedSoundForCurrentBadState = true;
          }
        }
      } else if (rawPostureState === "SLIGHT") {
        postureBadStartTime = null;
        postureGoodStartTime = null;
        smoothedPostureState = "SLIGHT";
        hasPlayedSoundForCurrentBadState = false;
      } else if (rawPostureState === "GOOD") {
        postureBadStartTime = null;
        if (!postureGoodStartTime) {
          postureGoodStartTime = now;
        } else if (now - postureGoodStartTime >= DEBOUNCE_DELAY_MS) {
          smoothedPostureState = "GOOD";
          hasPlayedSoundForCurrentBadState = false;
          popupManuallyClosed = false; // Reset manually closed state on recovery
          resetTitleAlert();
        }
      }
    }

    // Update UI Elements and Control Pop-up Visibility
    function updateUI() {
      // Focus UI
      if (rawFocusState === "NO_HUMAN") {
        focusIcon.textContent = "👤";
        focusText.textContent = "Away";
        focusText.className = "text-base font-bold text-slate-400";
      } else if (rawFocusState === "IN") {
        focusIcon.textContent = "👁️";
        focusText.textContent = "In Focus";
        focusText.className = "text-base font-bold text-green-400";
      } else {
        focusIcon.textContent = "⚠️";
        focusText.textContent = "Focus Lost";
        focusText.className = "text-base font-bold text-amber-400";
      }

      // Posture UI & Pop-up Control
      if (rawPostureState === "NO_HUMAN") {
        postureIcon.textContent = "👤";
        postureText.textContent = "No Person Detected";
        postureText.className = "text-base font-bold text-slate-400";
        mirrorCard.className = "lg:col-span-2 relative aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-300";
        
        liveSvg.style.stroke = "#64748b";
        vizStatusText.textContent = "Waiting for user...";
        vizStatusText.className = "text-[10px] text-slate-400 mt-2 font-semibold";

        correctionPopup.classList.add('hidden');
        resetTitleAlert();
      } else if (smoothedPostureState === "GOOD" && rawFocusState === "IN") {
        postureIcon.textContent = "🧘";
        postureText.textContent = "Good Posture";
        postureText.className = "text-base font-bold text-green-400";
        mirrorCard.className = "lg:col-span-2 relative aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-300 glow-good";
        
        liveSvg.style.stroke = "#22c55e";
        svgSpine.setAttribute("d", "M25 18 L25 50");
        svgShoulders.setAttribute("d", "M12 28 L38 28");
        svgHead.setAttribute("cy", "12");
        vizStatusText.textContent = "Aligned";
        vizStatusText.className = "text-[10px] text-green-400 mt-2 font-semibold";

        // Hide Pop-up on good state
        correctionPopup.classList.add('hidden');
        resetTitleAlert();
      } else if (smoothedPostureState === "SLIGHT") {
        postureIcon.textContent = "⚠️";
        postureText.textContent = "Slight Posture Shift";
        postureText.className = "text-base font-bold text-amber-400";
        mirrorCard.className = "lg:col-span-2 relative aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-300 glow-warning";

        liveSvg.style.stroke = "#eab308";
        vizStatusText.textContent = "Slight Shift";
        vizStatusText.className = "text-[10px] text-amber-400 mt-2 font-semibold";

        correctionPopup.classList.add('hidden');
      } else if (smoothedPostureState === "BAD" || rawFocusState === "TURNING") {
        postureIcon.textContent = "🚨";
        postureText.textContent = smoothedPostureState === "BAD" ? postureReason : "Focus Lost";
        postureText.className = "text-base font-bold text-red-400";
        mirrorCard.className = "lg:col-span-2 relative aspect-video rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden transition-all duration-300 glow-bad";

        liveSvg.style.stroke = "#ef4444";
        svgSpine.setAttribute("d", "M25 18 Q 33 34 25 50");
        svgHead.setAttribute("cy", "16");
        vizStatusText.textContent = postureReason;
        vizStatusText.className = "text-[10px] text-red-400 mt-2 font-semibold";

        // Show Floating Pop-up mirror with posture correction
        if (!popupManuallyClosed) {
          popupReason.textContent = smoothedPostureState === "BAD" ? postureReason : "Focus Turned Away";
          popupGuide.textContent = smoothedPostureState === "BAD" ? "Sit straight, align head and shoulders!" : "Turn back and face the camera directly.";
          correctionPopup.classList.remove('hidden');
        }
      }
    }

    // Camera Feed Setup
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        canvasElement.width = videoElement.videoWidth || 1280;
        canvasElement.height = videoElement.videoHeight || 720;
        await faceMesh.send({ image: videoElement });
        await pose.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
