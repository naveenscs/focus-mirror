<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mirror — Ambient Generative Focus Canvas</title>
  
  <!-- MediaPipe Pose & Camera Utils via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <!-- Three.js for Real-Time WebGL Generative Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050508; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }
    
    /* WebGL Canvas Background */
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* UI Overlay Controls */
    #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 12px; background: rgba(15, 15, 25, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 18px; border-radius: 14px; min-width: 280px; }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; opacity: 0.9; }
    
    .status-box { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; margin-top: 4px; }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #4CAF50; transition: background-color 0.3s; }
    
    .mode-toggle { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 3px; border: 1px solid rgba(255,255,255,0.08); margin-top: 8px; }
    .mode-btn { flex: 1; border: none; background: transparent; color: #aaa; padding: 6px 10px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .mode-btn.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; }
    
    /* Hidden Video Element for MediaPipe Tracking */
    #webcam { display: none; }
    
    /* Hidden/Minimized Live Preview Pip */
    #pip-container { position: absolute; bottom: 20px; right: 20px; z-index: 10; width: 140px; height: 105px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); background: #000; }
    #pip-canvas { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <h1>Focus Mirror</h1>
    
    <div class="status-box">
      <span>Focus & Posture State:</span>
      <div id="status-dot" class="status-indicator"></div>
    </div>
    
    <div class="status-box">
      <span id="status-text" style="opacity: 0.7;">Calibrating camera...</span>
    </div>

    <div class="mode-toggle">
      <button id="btn-screen" class="mode-btn active" onclick="setMode('screen')">Screen Mode</button>
      <button id="btn-book" class="mode-btn" onclick="setMode('book')">Book Study Mode</button>
    </div>
  </div>

  <div id="pip-container">
    <canvas id="pip-canvas"></canvas>
  </div>

  <video id="webcam" playsinline></video>

  <script>
    // --- Application State ---
    let currentMode = 'screen'; // 'screen' or 'book'
    let baselineNoseY = null;
    let focusScore = 1.0; // 1.0 = Fully Focused, 0.0 = Distracted/Slouching
    
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-screen').classList.toggle('active', mode === 'screen');
      document.getElementById('btn-book').classList.toggle('active', mode === 'book');
      baselineNoseY = null; // Re-calibrate baseline
      statusText.innerText = `Switched to ${mode === 'screen' ? 'Screen Work' : 'Book Study'} Mode`;
    }

    // --- WebGL Generative Scene Setup (Three.js) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Particle Swarm Geometry
    const particleCount = 2000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 10;
      positions[i + 1] = (Math.random() - 0.5) * 10;
      positions[i + 2] = (Math.random() - 0.5) * 10;

      colors[i] = 0.2 + Math.random() * 0.5; // R
      colors[i + 1] = 0.5 + Math.random() * 0.5; // G
      colors[i + 2] = 0.9 + Math.random() * 0.1; // B
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);
    camera.position.z = 5;

    // WebGL Render Loop
    function animate() {
      requestAnimationFrame(animate);
      
      // Rotate particles continuously
      const speed = 0.002 + (focusScore * 0.005);
      particles.rotation.y += speed;
      particles.rotation.x += speed * 0.5;

      // React to Focus State: Expand/Contract geometry & alter opacity
      const scaleTarget = 0.5 + (focusScore * 0.8);
      particles.scale.lerp(new THREE.Vector3(scaleTarget, scaleTarget, scaleTarget), 0.05);
      
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- MediaPipe Pose Tracking & Logic ---
    const videoElement = document.getElementById('webcam');
    const pipCanvas = document.getElementById('pip-canvas');
    const pipCtx = pipCanvas.getContext('2d');

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    function onPoseResults(results) {
      // Draw live picture-in-picture feedback
      pipCtx.save();
      pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
      pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
      pipCtx.restore();

      if (!results.poseLandmarks) {
        // No face/person detected -> Distracted
        updateFocusState(0.0, "No face detected in frame");
        return;
      }

      const landmarks = results.poseLandmarks;
      const nose = landmarks[0];
      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];

      if (!nose || !leftShoulder || !rightShoulder) return;

      const shoulderCenterY = (leftShoulder.y + rightShoulder.y) / 2;
      const headToShoulderDist = shoulderCenterY - nose.y;

      // Set baseline calibration on first load
      if (baselineNoseY === null) {
        baselineNoseY = headToShoulderDist;
      }

      // Detect posture degradation based on head displacement relative to shoulders
      const threshold = currentMode === 'screen' ? 0.75 : 0.55; 
      const currentRatio = headToShoulderDist / baselineNoseY;

      if (currentRatio < threshold) {
        // Slouching or excessive head drop
        updateFocusState(0.2, "Posture Slouch Detected");
      } else {
        // Optimal alignment
        updateFocusState(1.0, "Optimal Alignment");
      }
    }

    function updateFocusState(score, text) {
      focusScore = score;
      statusText.innerText = text;

      if (score > 0.7) {
        statusDot.style.backgroundColor = '#4CAF50'; // Green
      } else if (score > 0.3) {
        statusDot.style.backgroundColor = '#FFC107'; // Yellow
      } else {
        statusDot.style.backgroundColor = '#F44336'; // Red
      }
    }

    // Initialize Camera Feed
    const cameraFeed = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraFeed.start();
  </script>
</body>
</html>
